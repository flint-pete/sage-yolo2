name: "sage-yolo2"
namespace: "beckman"
version: "2.0.0"
description: "YOLO11x object counter, re-architected as a pywaggle2 cache consumer — reads frames a producer (image-sampler2) wrote to the shared on-node cache, runs YOLO11x, publishes per-class counts frame-anchored (observation time = capture time), and optionally uploads annotated images. Standalone stream/snapshot fallbacks for stock nodes."
authors: "Pete Beckman"
collaborators: "Sage Team"
funding: "NSF 2436842"
license: "BSD 3-clause"
keywords: "object detection, object counting, YOLO, computer vision, machine learning, deep learning, edge computing, camera, cache consumer, pywaggle2"
homepage: "https://sagecontinuum.org"
source:
    architectures:
        - "linux/arm64"    # Thor target. ECR portal build FAILS (QEMU crash on
        # NVIDIA CUDA base, Infra #3) — deploy via native Thor build + k3s side-load.
        # - "linux/amd64"  # not targeted: plugin runs only on arm64 Thor/Jetson nodes
    url: "https://github.com/flint-pete/sage-yolo2.git"
    branch: "master"
inputs:
    - id: "source"
      type: "string"
      description: "Acquisition mode: cache (consume producer frames from the shared WES cache — production), stream / snapshot (open a live camera — standalone fallback), or image-dir (local test folder)."
    - id: "input"
      type: "string"
      description: "The source's argument: cache dir (<root>/<cache-name>/<camera>) | camera name or RTSP URL | HTTP snapshot URL | directory of test images."
    - id: "every"
      type: "string"
      description: "Wake cadence (batch clock): how often to process a batch. 0 = single-shot (run once, exit). Accepts s/m/h suffixes (e.g. 1h)."
    - id: "select-every"
      type: "string"
      description: "Sampling stride: one frame per this much CAPTURE-time. 0 = the single newest unseen frame. Accepts s/m/h (e.g. 15m)."
    - id: "max-frames"
      type: "int"
      description: "Cap frames processed per wake (0 = unlimited). With select-every 0 this means the K newest frames."
    - id: "all-unseen"
      type: "string"
      description: "Flag (no value). Backlog mode — process every not-yet-seen frame in the cache (capped by max-frames per wake). Include '--all-unseen' to enable."
    - id: "max-runtime"
      type: "int"
      description: "Overall wall-clock bound in seconds (0 = forever). Lets a scheduled job self-exit to free the GPU."
    - id: "consumer-id"
      type: "string"
      description: "Override the seen-store <consumer-id> segment (default: WAGGLE_JOB_NAME+WAGGLE_TASK_NAME). Give two instances the SAME id to make them cooperatively divide one cache."
    - id: "seen-store"
      type: "string"
      description: "Override the full seen-store path (default: auto, under the cache's reserved .state area)."
    - id: "reprocess"
      type: "string"
      description: "Flag (no value). Ignore the seen-store (process frames regardless of memory); still records what it processes. Include '--reprocess' to enable."
    - id: "model"
      type: "string"
      description: "YOLO model name/path — yolo11x.pt (default, 54.7% mAP), yolo11n.pt (speed), yolov8x.pt"
    - id: "classes"
      type: "string"
      description: "Comma-separated COCO class names to count, e.g. 'person,car,bird'. Empty = all 80 classes"
    - id: "conf-thres"
      type: "float"
      description: "Confidence threshold 0.0–1.0 (default: 0.25)"
    - id: "iou-thres"
      type: "float"
      description: "IoU threshold for non-maximum suppression (default: 0.45)"
    - id: "imgsz"
      type: "int"
      description: "Input image size for inference (default: 640). Larger = better small-object detection, more GPU memory."
    - id: "half"
      type: "string"
      description: "Flag (no value). FP16 half-precision inference — faster, slightly less accurate. Include '--half' to enable."
    - id: "max-det"
      type: "int"
      description: "Maximum detections per image (default: 300)"
    - id: "augment"
      type: "string"
      description: "Flag (no value). Test-time augmentation (TTA) at ~3x speed cost. Include '--augment' to enable."
    - id: "agnostic-nms"
      type: "string"
      description: "Flag (no value). Class-agnostic NMS. Include '--agnostic-nms' to enable."
    - id: "upload-image"
      type: "string"
      description: "Y = allow annotated-image uploads, N = never. Governed by save-match when set."
    - id: "save-match"
      type: "string"
      description: "Controls image SAVING. OR-list of Class:confidence rules, e.g. 'bird:0.5,cat:0.6', or '*:0.5' for any detection. Frame uploaded if any detection matches any rule."
resources:
    - type: "RGB_image_producer"
      view: "street"
      min_resolution: "640x480"
metadata:
    ontology: env.count.*
testing:
    mask_entrypoint: true
    command: ["python3", "-m", "pytest", "-q", "tests/"]
