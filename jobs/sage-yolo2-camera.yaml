# ──────────────────────────────────────────────────────────────
# sage-yolo2 — producer + consumer SES job TEMPLATE
#
# STATUS: UNTESTED SES TEMPLATE. The verified way to run this cascade today is
# `sudo pluginctl run` with side-loaded images — see the media-sampler3 install
# guide, Steps 6b–6d:
#   https://github.com/flint-pete/media-sampler3/blob/master/INSTALLING-MEDIA-SAMPLER3.md
# This file shows the intended scheduled-job shape once the images are in the
# registry. Before submitting: replace <VSN> / <CAM_IP>, add the /local-cache
# hostPath volume mount your SES version supports (both pods must mount the
# cache), map camera creds into the producer's env from a Secret (never args),
# and register the ECR catalog record (scripts/deploy-sideload.sh without
# --skip-register).
#
# The v2 architecture: media-sampler3 (PRODUCER) opens the camera once and writes
# frames into the shared cache; sage-yolo2 (CONSUMER) reads them and runs YOLO —
# it never opens a camera.
#
#   media-sampler3  --cache-name camera --name top   -> /local-cache/camera/top/
#   sage-yolo2      --source cache --input /local-cache/camera/top
#                   --crop-cache-name camera-crops   -> /local-cache/camera-crops/top-crop-N/
#
# Submit (write-scoped token):
#   scripts/deploy-sideload.sh --submit jobs/sage-yolo2-camera.yaml
# ──────────────────────────────────────────────────────────────
name: sage-yolo2-camera
plugins:
  # PRODUCER: one camera open, frames -> /local-cache/camera/top
  - name: media-sampler3
    pluginSpec:
      image: registry.sagecontinuum.org/beckman/media-sampler3:0.1.1
      args:
        - "--continuous"
        - "10"
        - "--media"
        - "image"
        - "--stream"
        - "top_camera"
        - "--name"
        - "top"
        - "--cache-root"
        - "/local-cache"
        - "--cache-name"
        - "camera"
        - "--cache-max-count"
        - "200"
        - "--cache-max-mb"
        - "500"
        - "--camera-host"
        - "<CAM_IP>"
        - "--camera-port"
        - "80"
      selector:
        zone: core
  # CONSUMER: reads the cache, counts birds, crops them for sage-bioclip2.
  - name: sage-yolo2
    pluginSpec:
      image: registry.sagecontinuum.org/beckman/sage-yolo2:2.1.1
      args:
        - "--source"
        - "cache"
        - "--input"
        - "/local-cache/camera/top"
        - "--every"
        - "5m"
        - "--all-unseen"
        - "--max-frames"
        - "0"
        - "--model"
        - "yolo11x.pt"
        - "--conf-thres"
        - "0.25"
        - "--classes"
        - "bird"
        - "--crop-match"
        - "bird:0.4"
        - "--crop-padding"
        - "0.15"
        - "--crop-cache-name"
        - "camera-crops"
      selector:
        zone: core
nodes:
  <VSN>: true   # replace with your node VSN, e.g. H041
scienceRules:
  # Both loop forever; start them once.
  - "schedule(media-sampler3): cronjob('media-sampler3', '@reboot')"
  - "schedule(sage-yolo2): cronjob('sage-yolo2', '@reboot')"
successcriteria:
  - WallClock('30day')
