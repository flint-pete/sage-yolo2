# ──────────────────────────────────────────────────────────────
# sage-yolo2 — sample job (STANDALONE stream fallback)
# Deploy on node W097 (Chicago) counting people and vehicles.
#
# NOTE: this uses --source stream (sage-yolo2 opens the camera directly). That's the
# standalone FALLBACK path for a stock node with no shared cache. The intended v2
# production path is --source cache (consume image-sampler2's frames) — see
# jobs/sage-yolo2-hummingcam-h00f.yaml.
# ──────────────────────────────────────────────────────────────
name: yolo-counter-chicago
plugins:
  - name: sage-yolo2
    pluginSpec:
      image: registry.sagecontinuum.org/beckman/sage-yolo2:2.0.0
      args:
        - "--source"
        - "stream"
        - "--input"
        - "bottom_camera"
        - "--model"
        - "yolo11n.pt"          # lightweight model for demo; change to yolo11x.pt for best accuracy
        - "--every"
        - "30s"
        - "--conf-thres"
        - "0.25"
        - "--classes"
        - "person,car,truck,bus,bicycle"
        - "--upload-image"
        - "Y"
      selector:
        resource.gpu: "true"
nodes:
  W097: true
scienceRules:
  - "schedule(sage-yolo2): cronjob('sage-yolo2', '*/5 * * * *')"
